<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>变更日志 — 便利店零售管理系统</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #333; }
.container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
.header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; padding: 40px 20px; text-align: center; border-radius: 8px 8px 0 0; }
.header h1 { font-size: 28px; margin-bottom: 8px; }
.header p { font-size: 14px; opacity: 0.7; }
.content { background: #fff; padding: 40px; border-radius: 0 0 8px 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); line-height: 1.8; }
.content h1 { font-size: 24px; margin: 32px 0 16px; padding-bottom: 8px; border-bottom: 2px solid #eee; color: #1a1a2e; }
.content h2 { font-size: 20px; margin: 28px 0 12px; color: #16213e; }
.content h3 { font-size: 17px; margin: 20px 0 10px; color: #333; }
.content h4 { font-size: 15px; margin: 16px 0 8px; color: #555; }
.content p { margin: 8px 0; }
.content ul, .content ol { padding-left: 24px; margin: 8px 0; }
.content li { margin: 4px 0; }
.content code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 13px; color: #d63384; }
.content pre { background: #282c34; color: #abb2bf; padding: 16px 20px; border-radius: 6px; overflow-x: auto; margin: 12px 0; font-size: 13px; line-height: 1.6; }
.content pre code { background: none; color: inherit; padding: 0; }
.content blockquote { border-left: 4px solid #1a1a2e; padding: 8px 16px; margin: 12px 0; background: #f8f9fa; color: #666; }
.content hr { border: none; border-top: 1px solid #eee; margin: 24px 0; }
.content strong { color: #1a1a2e; }
.content a { color: #0366d6; text-decoration: none; }
.content a:hover { text-decoration: underline; }
.content table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
.content th { background: #f0f0f0; padding: 10px 12px; text-align: left; border: 1px solid #ddd; }
.content td { padding: 8px 12px; border: 1px solid #ddd; }
.content tr:hover { background: #f8f9fa; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
.badge-high { background: #fee2e2; color: #dc2626; }
.badge-medium { background: #fef3c7; color: #d97706; }
.badge-low { background: #dbeafe; color: #2563eb; }
@media (max-width: 768px) {
  .container { padding: 20px 10px; }
  .content { padding: 20px; }
  .header { padding: 24px 16px; }
  .header h1 { font-size: 22px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>变更日志</h1>
    <p>便利店零售管理系统 — CHANGELOG — 2026-08-18</p>
  </div>
  <div class="content" id="content"></div>
</div>
<script>
fetch('CHANGELOG.md')
  .then(r => r.text())
  .then(md => {
    document.getElementById('content').innerHTML = marked.parse(md);
  })
  .catch(() => {
    document.getElementById('content').innerHTML = '<p style="color:red;">无法加载 CHANGELOG.md</p>';
  });
</script>
</body>
</html>
