{extend name="layout" /}
{block name="content"}
<div class="search-form">
    <div class="layui-inline"><input type="text" id="search-keyword" placeholder="名称/条码/拼音码…" class="layui-input" value="{$keyword|default=''}"></div>
    <div class="layui-inline">
        <select id="search-cate"><option value="">全部分类</option>
            {foreach $cateList as $c}<option value="{$c}" {if isset($cate) && $cate===$c}selected{/if}>{$c}</option>{/foreach}
        </select>
    </div>
    <div class="layui-inline">
        <select id="search-location"><option value="">全部库位</option>
            {foreach $locationList as $l}<option value="{$l}" {if isset($location) && $location===$l}selected{/if}>{$l}</option>{/foreach}
        </select>
    </div>
    <div class="layui-inline"><button class="layui-btn layui-btn-primary" onclick="doSearch()"><i class="layui-icon layui-icon-search"></i> 搜索</button></div>
    <div class="btn-group-right">
        <button class="layui-btn layui-btn-primary" onclick="exportData()"><i class="layui-icon layui-icon-export"></i> 导出</button>
        <button class="layui-btn layui-btn-normal" id="btn-batch-threshold" onclick="batchThreshold()">批量设置阈值</button>
    </div>
</div>
<table id="stock-table" lay-filter="stockTable"></table>
{/block}

{block name="script"}
<script>
var selectedIds = {};

layui.use(['table', 'element', 'form'], function(){
    var table = layui.table;
    layui.form.render('select');
    table.render({
        elem: '#stock-table',
        url: '/stock/list',
        where: {
            keyword: '{$keyword|default=""}',
            cate: '{$cate|default=""}',
            location: '{$location|default=""}'
        },
        cols: [[
            {type: 'checkbox'},
            {field: 'id', title: 'ID', width: 60},
            {field: 'name', title: '名称', width: 130},
            {field: 'barcode', title: '条码', width: 120},
            {field: 'pinyin_code', title: '拼音码', width: 90},
            {field: 'cate', title: '分类', width: 80},
            {field: 'stock', title: '库存', width: 70},
            {field: 'stock_min', title: '库存下限', width: 90, edit: 'number'},
            {field: 'stock_max', title: '库存上限', width: 90, edit: 'number'},
            {field: 'location', title: '库位', width: 80},
            {field: 'expiry_date', title: '到期日期', width: 100, templet: function(d){
                return d.expiry_date ? new Date(d.expiry_date * 1000).toLocaleDateString() : '-';
            }},
            {field: 'unit', title: '单位', width: 60},
            {title: '操作', toolbar: '#stockToolbar', width: 150}
        ]],
        page: {limits: [10, 20, 50, 100, 200]},
        done: function(res){
            res.data.forEach(function(item, i){
                var $tr = $('.layui-table-body tbody tr').eq(i);
                if (item.stock_min && item.stock < item.stock_min) $tr.addClass('row-stock-low');
                else if (item.stock_max && item.stock > item.stock_max) $tr.addClass('row-stock-high');
                if (item.expiry_date && item.expiry_date < Math.floor(Date.now()/1000) + 30*86400) $tr.addClass('row-expiry');
            });
        }
    });

    table.on('checkbox(stockTable)', function(obj){
        if (obj.type === 'all') {
            var allChecked = obj.checked;
            var currentData = layui.table.cache['stockTable'] || [];
            if (allChecked) {
                currentData.forEach(function(d){ selectedIds[d.id] = true; });
            } else {
                selectedIds = {};
            }
        } else if (obj.data && obj.data.id) {
            if (obj.checked) {
                selectedIds[obj.data.id] = true;
            } else {
                delete selectedIds[obj.data.id];
            }
        }
        updateBatchButton();
    });

    table.on('edit(stockTable)', function(obj){
        $.post('/stock/updateThreshold', {
            id: obj.data.id,
            stock_min: obj.field === 'stock_min' ? obj.value : obj.data.stock_min,
            stock_max: obj.field === 'stock_max' ? obj.value : obj.data.stock_max
        }, function(res){
            if (res.code === 0) layer.msg(res.msg, {icon:1});
            else layer.msg(res.msg, {icon:2});
        });
    });

    table.on('tool(stockTable)', function(obj){
        if (obj.event === 'detail') {
            showStockDetail(obj.data);
        } else if (obj.event === 'adjust') {
            openAdjust(obj.data);
        }
    });
});

function updateBatchButton(){
    var count = Object.keys(selectedIds).length;
    $('#btn-batch-threshold').text('批量设置阈值' + (count > 0 ? '（' + count + '）' : ''));
}

window.batchThreshold = function(){
    var ids = Object.keys(selectedIds);
    if (ids.length === 0) { layer.msg('请勾选商品'); return; }
    var html = '<div style="padding:20px;">\
        <div class="layui-form-item"><label class="layui-form-label">库存下限</label><div class="layui-input-block"><input type="number" name="stock_min" class="layui-input" placeholder="留空不修改"></div></div>\
        <div class="layui-form-item"><label class="layui-form-label">库存上限</label><div class="layui-input-block"><input type="number" name="stock_max" class="layui-input" placeholder="留空不修改"></div></div>\
        <div style="color:#999;margin-top:8px;">已选中 <strong>' + ids.length + '</strong> 个商品</div>\
    </div>';
    layer.open({
        type: 1, title: '批量设置阈值', area: ['420px', '300px'], content: html,
        btn: ['确定', '取消'],
        yes: function(index, layero){
            var form = layui.$(layero);
            var smin = form.find('[name=stock_min]').val();
            var smax = form.find('[name=stock_max]').val();
            if (!smin && !smax) { layer.msg('请至少设置一个阈值'); return; }
            $.post('/stock/batchThreshold', {ids: ids.join(','), stock_min: smin, stock_max: smax}, function(res){
                if (res.code === 0) { layer.msg(res.msg, {icon:1}); setTimeout(function(){ location.reload(); }, 500); }
                else layer.msg(res.msg, {icon:2});
            });
            layer.close(index);
        }
    });
};

window.openAdjust = function(data){
    var html = '<div style="padding:20px;">\
        <div class="layui-form-item"><label class="layui-form-label">商品</label><div class="layui-input-block" style="line-height:36px;">' + data.name + ' | 条码：' + data.barcode + ' | 当前库存：<strong>' + data.stock + '</strong></div></div>\
        <div class="layui-form-item"><label class="layui-form-label">新库存</label><div class="layui-input-block"><input type="number" name="new_stock" value="' + data.stock + '" class="layui-input"></div></div>\
        <div class="layui-form-item"><label class="layui-form-label">调整原因</label><div class="layui-input-block"><select name="reason"><option value="库存修正">库存修正</option><option value="损耗报损">损耗报损</option><option value="过期处理">过期处理</option><option value="其他">其他</option></select></div></div>\
        <div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><input type="text" name="remark" class="layui-input"></div></div>\
    </div>';
    layer.open({
        type: 1, title: '库存调整', area: ['450px', '350px'], content: html,
        btn: ['确认调整', '取消'],
        success: function(layero){ layui.form.render('select'); },
        yes: function(index, layero){
            var form = layui.$(layero);
            var newStock = form.find('[name=new_stock]').val();
            if (newStock === '' || newStock === null) { layer.msg('请输入新库存数量'); return; }
            $.post('/stock/adjust', {
                barcode: data.barcode,
                new_stock: newStock,
                reason: form.find('[name=reason]').val(),
                remark: form.find('[name=remark]').val()
            }, function(res){
                if (res.code === 0) { layer.msg(res.msg, {icon:1}); setTimeout(function(){ location.reload(); }, 500); }
                else layer.msg(res.msg, {icon:2});
            });
            layer.close(index);
        }
    });
};

window.showStockDetail = function(data){
    var loading = layer.load();
    $.get('/stock/detail', {barcode: data.barcode}, function(res){
        layer.close(loading);
        if (res.code !== 0) { layer.msg(res.msg, {icon:2}); return; }
        var d = res.data;
        var headerHtml = '<div style="padding:8px 0;font-size:14px;">';
        headerHtml += '<strong>' + d.goods_name + '</strong> | 条码：' + d.barcode;
        if (d.location) headerHtml += ' | 库位：' + d.location;
        if (d.expiry_date) headerHtml += ' | 到期：' + d.expiry_date;
        headerHtml += ' | 当前库存：<span style="color:#009688;font-size:16px;">' + d.stock + '</span></div>';
        if (d.rows.length === 0) {
            headerHtml += '<div style="color:#999;padding:10px 0;">暂无变动记录</div>';
            layer.open({ type:1, title:'库存明细', area:['750px','300px'], content: headerHtml });
            return;
        }
        var tblHtml = '<table class="layui-table" style="margin:0;"><thead><tr><th>时间</th><th>类型</th><th>变动数量</th><th>变动后库存</th><th>关联单号</th></tr></thead><tbody>';
        d.rows.forEach(function(r){
            var cls = r.qty_change > 0 ? 'color:#009688;' : 'color:#FF5722;';
            var sign = r.qty_change > 0 ? '+' + r.qty_change : r.qty_change;
            tblHtml += '<tr><td>' + new Date(r.create_time * 1000).toLocaleString() + '</td><td style="' + cls + 'font-weight:bold;">' + r.type + '</td><td>' + sign + '</td><td>' + r.balance + '</td><td>' + (r.ref_no || '-') + '</td></tr>';
        });
        tblHtml += '</tbody></table>';
        layer.open({
            type: 1, title: '库存明细', area: ['800px', '480px'],
            content: '<div style="padding:12px;max-height:400px;overflow-y:auto;">' + headerHtml + tblHtml + '</div>'
        });
    });
};
</script>

<script type="text/html" id="stockToolbar">
    <button class="layui-btn layui-btn-xs layui-btn-normal" lay-event="detail">库存明细</button>
    <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="adjust">调整</button>
</script>

<script>
window.doSearch = function(){
    layui.table.reload('stock-table', {
        where: {
            keyword: $('#search-keyword').val(),
            cate: $('#search-cate').val(),
            location: $('#search-location').val()
        }
    });
};
window.exportData = function(){ location.href = '/stock/export'; };
</script>
{/block}
