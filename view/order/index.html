﻿﻿﻿﻿﻿﻿﻿﻿{extend name="layout" /}
{block name="content"}
<div class="search-form">
    <div class="layui-inline"><input type="text" id="search-keyword" placeholder="订单号…" class="layui-input" value="{$keyword|default=''}"></div>
    <div class="layui-inline"><input type="text" id="search-start" placeholder="开始日期…" class="layui-input" value="{$start_date|default=''}"></div>
    <div class="layui-inline"><input type="text" id="search-end" placeholder="结束日期…" class="layui-input" value="{$end_date|default=''}"></div>
    <div class="layui-inline"><button class="layui-btn layui-btn-primary" onclick="doSearch()"><i class="layui-icon layui-icon-search"></i> 搜索</button></div>
    <div class="layui-inline"><button class="layui-btn layui-btn-primary" onclick="exportData()"><i class="layui-icon layui-icon-export"></i> 导出</button></div>
    <div class="layui-inline"><button class="layui-btn layui-btn-primary" id="import-btn"><i class="layui-icon layui-icon-upload-drag"></i> 导入</button></div>
    <div class="layui-inline"><button class="layui-btn layui-btn-primary" onclick="downloadTemplate()"><i class="layui-icon layui-icon-download-circle"></i> 模板下载</button></div>
</div>
<table id="order-table" lay-filter="orderTable"></table>

<script type="text/html" id="toolbar">
    <button class="layui-btn layui-btn-xs" lay-event="detail">查看明细</button>
</script>
{/block}

{block name="script"}
<script>
layui.use(['table', 'laydate'], function(){
    var table = layui.table;
    layui.laydate.render({elem: '#search-start'});
    layui.laydate.render({elem: '#search-end'});

    table.render({
        elem: '#order-table',
        url: '/order/list',
        where: {
            keyword: '{$keyword|default=""}',
            start_date: '{$start_date|default=""}',
            end_date: '{$end_date|default=""}'
        },
        cols: [[
            {field: 'order_no', title: '订单号', width: 170},
            {field: 'total_amount', title: '原价', width: 80},
            {field: 'discount_amount', title: '折扣', width: 80},
            {field: 'pay_amount', title: '实付', width: 80},
            {field: 'pay_type_text', title: '支付方式', width: 90},
            {field: 'buyer_name', title: '购买者', width: 90},
            {field: 'buyer_phone', title: '电话', width: 120},
            {field: 'operator_name', title: '操作员', width: 90},
            {field: 'create_time', title: '时间', width: 170, templet: function(d){ return new Date(d.create_time * 1000).toLocaleString(); }},
            {title: '操作', toolbar: '#toolbar', width: 80}
        ]],
        page: {limits: [10, 20, 50, 100, 200]}
    });

    table.on('tool(orderTable)', function(obj){
        if (obj.event === 'detail') location.href = '/order/detail?id=' + obj.data.id;
    });
});

window.doSearch = function(){
    layui.table.reload('order-table', {
        where: {
            keyword: $('#search-keyword').val(),
            start_date: $('#search-start').val(),
            end_date: $('#search-end').val()
        }
    });
};

window.exportData = function(){ location.href = '/order/export'; };
window.downloadTemplate = function(){ location.href = '/order/downloadTemplate'; };

layui.use(['upload'], function(){
    var upload = layui.upload;
    upload.render({
        elem: '#import-btn',
        url: '/order/import',
        accept: 'file',
        exts: 'xls|xlsx',
        done: function(res){
            if (res.code === 0) {
                layer.msg(res.msg, {icon: 1}, function(){ location.reload(); });
            } else {
                layer.msg(res.msg, {icon: 2});
            }
        }
    });
});
</script>
{/block}
